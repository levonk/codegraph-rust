---
name: Nix flake

# Validates the flake (flake.nix). Nix is a side concern for this repo, so
# this job is path-filtered to the flake files — it fires only when they
# change, not on every source/docs commit.
#
# Steps, in order of what they catch:
#   1. nix flake check --all-systems --no-build — every system's outputs
#      evaluate (including darwin on an ubuntu runner).
#   2. nix build .#default                  — the default-features build
#      (daemon) realises for the runner's system.
#   3. nix run .#default -- --help          — the built binary actually
#      execs and prints help. This is the only step that catches the
#      `let ... in rec` shadowing class of bug (passes flake check, fails
#      nix run). Do NOT drop it.
#   4. nix build .#source                    — the from-source build path
#      (same derivation as .#default here, but exercises the named output
#      users are told to run).

on:
  push:
    branches: [main]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "**/*.nix"
      - ".github/workflows/nix.yml"
  pull_request:
    branches: [main]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "**/*.nix"
      - ".github/workflows/nix.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: nix-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: nix flake check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Nix
        # DeterminateSystems/nix-installer-action installs Nix natively on the
        # runner so `nix build` / `nix run` work directly (a Docker-container
        # approach can run `nix flake check` but is awkward for build+smoke).
        uses: DeterminateSystems/nix-installer-action@v16

      - name: nix flake check --all-systems
        # --no-build: evaluate every system's outputs (including darwin on
        # ubuntu) without realising them. Without --no-build, `nix flake
        # check` builds every derivation in `checks`, which fails for
        # non-native systems (darwin stdenv can't run on linux). The
        # build/run steps below handle realisation for the runner's system.
        run: nix flake check --all-systems --no-build

      - name: nix build .#default
        run: nix build .#default --print-build-logs

      - name: nix run .#default -- --help
        # `codegraph --help` is the cheapest smoke test that the binary
        # links and runs. `--version` would also work (clap derives it
        # from the workspace version), but `--help` also confirms the
        # subcommand tree is wired up.
        run: nix run .#default -- --help

      - name: nix build .#source
        # Exercises the named `#source` output that the README advertises.
        run: nix build .#source --print-build-logs
